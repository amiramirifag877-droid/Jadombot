services:
  - type: web
    name: jado-movie-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jado-movie-db
          property: connectionString
      - key: PORT
        value: "10000"

databases:
  - name: jado-movie-db
    plan: free
